<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Combat Clean — Config Editor</title>
<style>
  :root {
    --bg:#0b0e17; --panel:#141926; --panel2:#1b2233; --line:#26304a; --text:#e7ecf7; --dim:#93a0bd;
    --accent:#5a8cff; --success:#33c6a6; --error:#ff5d6c; --warn:#ffc24b;
    --mono:'SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--text); font:14px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; overflow:hidden; }

  /* Layout */
  .app { display:flex; height:100vh; }
  .sidebar { width:240px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; overflow-y:auto; }
  .main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .topbar { background:var(--panel); border-bottom:1px solid var(--line); padding:12px 20px; display:flex; align-items:center; gap:12px; }
  .content { flex:1; overflow-y:auto; padding:20px; }

  /* Topbar */
  .search-box { flex:1; max-width:400px; }
  .search-box input { width:100%; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font:13px system-ui; }
  .search-box input:focus { outline:none; border-color:var(--accent); }

  /* Sidebar */
  .sidebar-section { padding:16px 0; border-bottom:1px solid var(--line); }
  .sidebar-section:last-child { border-bottom:none; }
  .sidebar-title { padding:0 16px 8px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); }
  .nav-item { padding:8px 16px; cursor:pointer; transition:background .15s; color:var(--text); font-size:13px; }
  .nav-item:hover { background:rgba(255,255,255,.04); }
  .nav-item.active { background:var(--panel2); color:var(--accent); font-weight:600; }

  /* Entity list (left side of content when category selected) */
  .entity-container { display:flex; gap:20px; height:100%; }
  .entity-list { width:280px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; overflow-y:auto; }
  .entity-list-header { margin-bottom:10px; }
  .entity-list-header input { width:100%; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:12px system-ui; }
  .entity-item { padding:8px 10px; margin:2px 0; cursor:pointer; border-radius:6px; font-size:13px; transition:background .15s; }
  .entity-item:hover { background:var(--panel2); }
  .entity-item.active { background:var(--accent); color:#fff; font-weight:600; }
  .entity-forms { flex:1; overflow-y:auto; }

  /* Forms */
  .form-section { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  .form-section-title { font-size:16px; font-weight:700; margin-bottom:14px; color:var(--text); display:flex; align-items:center; gap:8px; }
  .form-section-title .badge { font-size:10px; font-weight:700; padding:3px 8px; border-radius:6px; background:rgba(90,140,255,.2); color:var(--accent); text-transform:uppercase; letter-spacing:.03em; }
  .form-section.empty { opacity:.6; }
  .form-section.empty::after { content:'(no data — saving will create)'; font-size:12px; color:var(--dim); }

  .field-group { margin-bottom:16px; }
  .field-group.nested { margin-left:16px; padding-left:12px; border-left:2px solid var(--line); }
  .field-label { display:flex; align-items:center; gap:6px; margin-bottom:6px; font-size:13px; font-weight:600; }
  .field-label .required { color:var(--error); font-size:11px; }
  .field-label .optional { color:var(--dim); font-size:11px; font-weight:400; }
  .field-description { font-size:12px; color:var(--dim); margin-bottom:6px; }
  .field-input { width:100%; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px 10px; font:13px var(--mono); }
  .field-input:focus { outline:none; border-color:var(--accent); }
  .field-input[type="checkbox"] { width:auto; height:18px; }
  .field-input.color-input { width:80px; }
  select.field-input { cursor:pointer; }

  .color-field { display:flex; gap:8px; align-items:center; }
  .color-swatch { width:32px; height:32px; border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  input[type="color"] { width:40px; height:32px; border:none; border-radius:6px; cursor:pointer; }

  /* Collapsible groups */
  .collapsible-header { display:flex; align-items:center; gap:8px; cursor:pointer; padding:8px 10px; margin:-8px -10px 10px; border-radius:6px; background:var(--panel2); }
  .collapsible-header:hover { background:rgba(255,255,255,.06); }
  .collapsible-arrow { font-size:11px; transition:transform .2s; }
  .collapsible-arrow.open { transform:rotate(90deg); }
  .collapsible-content { overflow:hidden; transition:max-height .3s; }
  .collapsible-content.collapsed { max-height:0; }

  /* Arrays & tuples */
  .array-items { display:flex; flex-direction:column; gap:10px; }
  .array-item { background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:10px; position:relative; }
  .array-item-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .array-item-index { font-size:12px; font-weight:600; color:var(--dim); }
  .array-btn-remove { background:var(--error); color:#fff; border:none; border-radius:6px; padding:4px 10px; font-size:11px; cursor:pointer; font-weight:600; }
  .array-btn-remove:hover { opacity:.85; }
  .array-btn-add { background:var(--accent); color:#fff; border:none; border-radius:6px; padding:8px 14px; font-size:12px; font-weight:600; cursor:pointer; margin-top:8px; }
  .array-btn-add:hover { opacity:.85; }

  /* Records */
  .record-rows { display:flex; flex-direction:column; gap:10px; }
  .record-row { background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:10px; display:grid; grid-template-columns:1fr 2fr auto; gap:10px; align-items:start; }
  .record-key-label, .record-value-label { font-size:11px; color:var(--dim); margin-bottom:4px; font-weight:600; }

  /* Buttons */
  .btn { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:10px 20px; font-size:13px; font-weight:700; cursor:pointer; transition:opacity .15s; }
  .btn:hover { opacity:.85; }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn-success { background:var(--success); }

  /* Toast */
  .toast { position:fixed; bottom:20px; right:20px; background:var(--success); color:#fff; padding:12px 18px; border-radius:8px; font-size:13px; font-weight:600; box-shadow:0 4px 12px rgba(0,0,0,.3); z-index:1000; animation:slideIn .3s; }
  .toast.error { background:var(--error); }
  @keyframes slideIn { from { transform:translateY(20px); opacity:0; } to { transform:translateY(0); opacity:1; } }

  /* Error display */
  .error-list { background:rgba(255,93,108,.1); border:1px solid var(--error); border-radius:8px; padding:12px; margin:12px 0; }
  .error-list-title { font-size:13px; font-weight:700; color:var(--error); margin-bottom:8px; }
  .error-item { font-family:var(--mono); font-size:12px; color:var(--error); margin:4px 0; }

  /* Loading / error screen */
  .centered-message { display:flex; align-items:center; justify-content:center; height:100vh; flex-direction:column; gap:12px; text-align:center; padding:20px; }
  .centered-message h1 { font-size:20px; color:var(--text); }
  .centered-message p { font-size:14px; color:var(--dim); max-width:500px; }
</style>
</head>
<body>
<div id="root"></div>

<script>
// ────────────────────────────────────────────────────────────────────────────
// State
// ────────────────────────────────────────────────────────────────────────────
const state = {
  manifest: null,
  values: null,
  error: null,
  currentView: null, // { type:'singleton', category } | { type:'entity', category, selected:id|key }
  globalSearch: '',
  entitySearch: '',
  saveErrors: {},
  collapsedGroups: {}, // path → boolean
};

// ────────────────────────────────────────────────────────────────────────────
// API
// ────────────────────────────────────────────────────────────────────────────
async function fetchManifest() {
  const res = await fetch('/__config/manifest');
  if (!res.ok) throw new Error(`Manifest fetch failed: ${res.status}`);
  return res.json();
}

async function fetchValues() {
  const res = await fetch('/__config/values');
  if (!res.ok) throw new Error(`Values fetch failed: ${res.status}`);
  return res.json();
}

async function saveConfig(registry, kind, category, id, value) {
  const res = await fetch('/__config/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ registry, kind, category, id, value }),
  });
  const data = await res.json();
  return data;
}

// ────────────────────────────────────────────────────────────────────────────
// Schema utils
// ────────────────────────────────────────────────────────────────────────────
function isRefField(propSchema, refMeta) {
  return propSchema[refMeta.configRef] || propSchema[refMeta.stringConfigRef] || propSchema[refMeta.recordKeyRef];
}

function getRefTarget(propSchema, refMeta) {
  const configRef = propSchema[refMeta.configRef];
  const stringConfigRef = propSchema[refMeta.stringConfigRef];
  const recordKeyRef = propSchema[refMeta.recordKeyRef];
  if (configRef) return Array.isArray(configRef) ? configRef[0] : configRef;
  if (stringConfigRef) return stringConfigRef.target;
  if (recordKeyRef) return recordKeyRef.target;
  return null;
}

function isRefNumeric(propSchema, refMeta) {
  return !!propSchema[refMeta.configRef];
}

function titleCase(s) {
  return String(s ?? '').replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

// ────────────────────────────────────────────────────────────────────────────
// Rendering
// ────────────────────────────────────────────────────────────────────────────
function render() {
  const root = document.getElementById('root');
  if (state.error) {
    root.innerHTML = `<div class="centered-message">
      <h1>Config endpoint not reachable</h1>
      <p>Run <code style="font-family:var(--mono); background:var(--panel); padding:2px 6px; border-radius:4px;">npm run dev</code> and open this page from the dev server (<code style="font-family:var(--mono); background:var(--panel); padding:2px 6px; border-radius:4px;">http://localhost:5274/config-editor.html</code>).</p>
    </div>`;
    return;
  }
  if (!state.manifest || !state.values) {
    root.innerHTML = `<div class="centered-message"><h1>Loading...</h1></div>`;
    return;
  }

  root.innerHTML = `
    <div class="app">
      <div class="sidebar">${renderSidebar()}</div>
      <div class="main">
        <div class="topbar">${renderTopbar()}</div>
        <div class="content">${renderContent()}</div>
      </div>
    </div>
  `;

  attachEventListeners();
}

function renderSidebar() {
  const { manifest } = state;
  const singletons = manifest.registries.logical.singletons || [];
  const entities = manifest.registries.logical.entities || [];

  return `
    <div class="sidebar-section">
      <div class="sidebar-title">Tuning</div>
      ${singletons.map(s => `<div class="nav-item ${state.currentView?.type === 'singleton' && state.currentView.category === s.name ? 'active' : ''}" data-nav="singleton:${s.name}">${titleCase(s.name)}</div>`).join('')}
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">Entities</div>
      ${entities.map(e => `<div class="nav-item ${state.currentView?.type === 'entity' && state.currentView.category === e.name ? 'active' : ''}" data-nav="entity:${e.name}">${titleCase(e.name)}</div>`).join('')}
    </div>
  `;
}

function renderTopbar() {
  return `
    <div class="search-box">
      <input type="search" id="globalSearch" placeholder="Search fields…" value="${state.globalSearch}" />
    </div>
  `;
}

function renderContent() {
  if (!state.currentView) {
    return '<div class="centered-message"><h1>Select a category from the sidebar</h1></div>';
  }

  if (state.currentView.type === 'singleton') {
    return renderSingletonForm();
  } else {
    return renderEntityView();
  }
}

function renderSingletonForm() {
  const { category } = state.currentView;
  const singleton = state.manifest.registries.logical.singletons.find(s => s.name === category);
  const value = state.values.logical.singletons[category] || {};
  const errors = state.saveErrors[`logical:singleton:${category}`];

  return `
    <div class="form-section">
      <div class="form-section-title">${titleCase(category)} <span class="badge">Singleton</span></div>
      ${renderSchema(singleton.schema, value, `logical:singleton:${category}`, [])}
      ${errors ? renderErrorList(errors) : ''}
      <button class="btn" data-save="logical:singleton:${category}">Save</button>
    </div>
  `;
}

function renderEntityView() {
  const { category, selected } = state.currentView;
  const entity = state.manifest.registries.logical.entities.find(e => e.name === category);
  const options = state.manifest.options[category] || [];
  const filteredOptions = options.filter(opt => {
    const label = opt.label.toLowerCase();
    return label.includes(state.entitySearch.toLowerCase());
  });

  const entityListHtml = `
    <div class="entity-list">
      <div class="entity-list-header">
        <input type="search" id="entitySearch" placeholder="Search…" value="${state.entitySearch}" />
      </div>
      ${filteredOptions.map(opt => {
        const entryId = entity.kind === 'id' ? opt.id : opt.key;
        return `<div class="entity-item ${selected === entryId ? 'active' : ''}" data-select="${category}:${entryId}">${opt.label}</div>`;
      }).join('')}
    </div>
  `;

  if (!selected) {
    return `<div class="entity-container">${entityListHtml}<div class="entity-forms"><div class="centered-message"><h1>Select an entry</h1></div></div></div>`;
  }

  // Render three stacked forms: Logical, UI, Visual
  const logicalValue = (state.values.logical.entities[category] || []).find(e => (entity.kind === 'id' ? e.id : e.key) === selected) || {};
  const uiValue = (state.values.ui[category] || {})[selected] || {};
  const visualValue = (state.values.visual[category] || {})[selected] || {};

  const logicalErrors = state.saveErrors[`logical:entity:${category}:${selected}`];
  const uiErrors = state.saveErrors[`ui:${category}:${selected}`];
  const visualErrors = state.saveErrors[`visual:${category}:${selected}`];

  const uiSchema = state.manifest.registries.ui.schema;
  const visualSchema = state.manifest.registries.visual.schema;

  // The ui/visual manifest schema IS the single-entry object schema (zUIConfig / zVisualConfig),
  // shared by every category — use it directly (the endpoint does NOT serve a category-keyed map).
  const uiCategorySchema = uiSchema || null;
  const visualCategorySchema = visualSchema || null;

  const formsHtml = `
    <div class="entity-forms">
      <div class="form-section">
        <div class="form-section-title">Logical <span class="badge">Gameplay</span></div>
        ${renderSchema(entity.schema, logicalValue, `logical:entity:${category}:${selected}`, [])}
        ${logicalErrors ? renderErrorList(logicalErrors) : ''}
        <button class="btn" data-save="logical:entity:${category}:${selected}">Save Logical</button>
      </div>
      <div class="form-section ${!uiCategorySchema || Object.keys(uiValue).length === 0 ? 'empty' : ''}">
        <div class="form-section-title">UI <span class="badge">Presentation</span></div>
        ${uiCategorySchema ? renderSchema(uiCategorySchema, uiValue, `ui:${category}:${selected}`, []) : '<p style="color:var(--dim); font-size:13px;">No UI schema available</p>'}
        ${uiErrors ? renderErrorList(uiErrors) : ''}
        ${uiCategorySchema ? `<button class="btn" data-save="ui:${category}:${selected}">Save UI</button>` : ''}
      </div>
      <div class="form-section ${!visualCategorySchema || Object.keys(visualValue).length === 0 ? 'empty' : ''}">
        <div class="form-section-title">Visual <span class="badge">Render</span></div>
        ${visualCategorySchema ? renderSchema(visualCategorySchema, visualValue, `visual:${category}:${selected}`, []) : '<p style="color:var(--dim); font-size:13px;">No visual schema available</p>'}
        ${visualErrors ? renderErrorList(visualErrors) : ''}
        ${visualCategorySchema ? `<button class="btn" data-save="visual:${category}:${selected}">Save Visual</button>` : ''}
      </div>
    </div>
  `;

  return `<div class="entity-container">${entityListHtml}${formsHtml}</div>`;
}

function renderSchema(schema, value, path, fieldPath) {
  if (!schema) return '';
  const { type, properties, required = [], items, prefixItems, additionalProperties, enum: enumValues, description } = schema;

  // Filter by global search
  const searchLower = state.globalSearch.toLowerCase();
  const fieldPathStr = fieldPath.join('.');
  if (searchLower && !fieldPathStr.toLowerCase().includes(searchLower)) {
    // If this is an object, check children
    if (type === 'object' && properties) {
      const childrenMatch = Object.keys(properties).some(key => {
        const childPath = [...fieldPath, key].join('.').toLowerCase();
        return childPath.includes(searchLower);
      });
      if (!childrenMatch) return '';
    } else {
      return '';
    }
  }

  if (type === 'object' && properties) {
    return renderObjectGroup(schema, value, path, fieldPath);
  } else if (prefixItems) {
    return renderTuple(schema, value, path, fieldPath);
  } else if (type === 'array' && items) {
    return renderArray(schema, value, path, fieldPath);
  } else if (additionalProperties && !properties) {
    return renderRecord(schema, value, path, fieldPath);
  } else if (enumValues) {
    return renderEnum(schema, value, path, fieldPath);
  } else if (type === 'boolean') {
    return renderBoolean(schema, value, path, fieldPath);
  } else if (type === 'number' || type === 'integer') {
    return renderNumber(schema, value, path, fieldPath);
  } else if (type === 'string') {
    return renderString(schema, value, path, fieldPath);
  }

  return '';
}

function renderObjectGroup(schema, value, path, fieldPath) {
  const { properties, required = [], description } = schema;
  const groupPath = fieldPath.join('.');
  const isCollapsed = state.collapsedGroups[groupPath];

  const lastKey = fieldPath[fieldPath.length - 1];
  // Array-item object groups (last path segment is a numeric index) are already labelled by the
  // enclosing `[i]` header — don't title them (and never titleCase a number → it throws).
  const title = fieldPath.length > 0 && typeof lastKey !== 'number' ? titleCase(lastKey) : '';
  const headerHtml = title ? `
    <div class="collapsible-header" data-toggle="${groupPath}">
      <span class="collapsible-arrow ${isCollapsed ? '' : 'open'}">▶</span>
      <span style="font-weight:600;">${title}</span>
      ${description ? `<span style="font-size:11px; color:var(--dim);">${description}</span>` : ''}
    </div>
  ` : '';

  const contentHtml = Object.keys(properties).map(key => {
    const propSchema = properties[key];
    const propValue = value?.[key];
    const isRequired = required.includes(key);
    const propPath = [...fieldPath, key];

    // Check if ref field
    const refMeta = state.manifest.refMeta;
    const isRef = isRefField(propSchema, refMeta);

    let fieldHtml = '';
    if (isRef) {
      fieldHtml = renderRefField(propSchema, propValue, path, propPath);
    } else {
      fieldHtml = renderSchema(propSchema, propValue, path, propPath);
    }

    return `
      <div class="field-group ${fieldPath.length > 0 ? 'nested' : ''}">
        <div class="field-label">
          ${titleCase(key)}
          ${isRequired ? '<span class="required">*</span>' : '<span class="optional">(optional)</span>'}
        </div>
        ${propSchema.description ? `<div class="field-description">${propSchema.description}</div>` : ''}
        ${fieldHtml}
      </div>
    `;
  }).join('');

  return `
    ${headerHtml}
    <div class="collapsible-content ${isCollapsed ? 'collapsed' : ''}" data-content="${groupPath}">
      ${contentHtml}
    </div>
  `;
}

function renderRefField(schema, value, path, fieldPath) {
  const refMeta = state.manifest.refMeta;
  const target = getRefTarget(schema, refMeta);
  const isNumeric = isRefNumeric(schema, refMeta);
  const options = state.manifest.options[target] || [];

  // Check if wrapped in array
  if (schema.type === 'array' && schema.items) {
    const itemSchema = schema.items;
    const arrayValue = Array.isArray(value) ? value : [];
    return `
      <div class="array-items" data-array-path="${fieldPath.join('.')}">
        ${arrayValue.map((v, i) => `
          <div class="array-item">
            <div class="array-item-header">
              <span class="array-item-index">[${i}]</span>
              <button class="array-btn-remove" data-array-remove="${path}§${fieldPath.join('.')}§${i}">× Remove</button>
            </div>
            ${renderRefSelect(target, v, `${path}:${[...fieldPath, i].join('.')}`, isNumeric, options)}
          </div>
        `).join('')}
        <button class="array-btn-add" data-array-add="${path}§${fieldPath.join('.')}§${isNumeric ? 'refNum' : 'refStr'}">+ Add</button>
      </div>
    `;
  }

  return renderRefSelect(target, value, `${path}:${fieldPath.join('.')}`, isNumeric, options);
}

function renderRefSelect(target, value, inputPath, isNumeric, options) {
  const selectHtml = `
    <select class="field-input" data-input="${inputPath}">
      ${isNumeric ? '<option value="0">(none)</option>' : ''}
      ${options.map(opt => {
        const optValue = isNumeric ? opt.id : opt.key;
        return `<option value="${optValue}" ${value == optValue ? 'selected' : ''}>${opt.label}</option>`;
      }).join('')}
    </select>
  `;
  return selectHtml;
}

function renderTuple(schema, value, path, fieldPath) {
  const { prefixItems } = schema;
  const tupleValue = Array.isArray(value) ? value : [];
  return `
    <div style="display:flex; gap:10px;">
      ${prefixItems.map((itemSchema, i) => {
        const itemValue = tupleValue[i];
        const itemPath = [...fieldPath, i];
        return `<div style="flex:1;">${renderSchema(itemSchema, itemValue, path, itemPath)}</div>`;
      }).join('')}
    </div>
  `;
}

function renderArray(schema, value, path, fieldPath) {
  const { items } = schema;
  const arrayValue = Array.isArray(value) ? value : [];
  return `
    <div class="array-items" data-array-path="${fieldPath.join('.')}">
      ${arrayValue.map((v, i) => `
        <div class="array-item">
          <div class="array-item-header">
            <span class="array-item-index">[${i}]</span>
            <button class="array-btn-remove" data-array-remove="${path}§${fieldPath.join('.')}§${i}">× Remove</button>
          </div>
          ${renderSchema(items, v, path, [...fieldPath, i])}
        </div>
      `).join('')}
      <button class="array-btn-add" data-array-add="${path}§${fieldPath.join('.')}§${items && items.type === 'object' ? 'object' : items && items.prefixItems ? 'tuple' : items && items.type === 'array' ? 'array' : 'scalar'}">+ Add</button>
    </div>
  `;
}

function renderRecord(schema, value, path, fieldPath) {
  const { additionalProperties } = schema;
  const refMeta = state.manifest.refMeta;
  const recordKeyRef = schema[refMeta.recordKeyRef];
  const recordValue = value || {};
  const entries = Object.entries(recordValue);

  let keyInput = '';
  if (recordKeyRef) {
    const target = recordKeyRef.target;
    const options = state.manifest.options[target] || [];
    keyInput = (key) => `
      <select class="field-input" data-record-rename="${path}§${fieldPath.join('.')}§${key}">
        ${options.map(opt => `<option value="${opt.key}" ${key === opt.key ? 'selected' : ''}>${opt.label}</option>`).join('')}
      </select>
    `;
  } else {
    keyInput = (key) => `<input type="text" class="field-input" value="${key}" data-record-rename="${path}§${fieldPath.join('.')}§${key}" />`;
  }

  return `
    <div class="record-rows" data-record-path="${fieldPath.join('.')}">
      ${entries.map(([key, val]) => `
        <div class="record-row">
          <div>
            <div class="record-key-label">Key</div>
            ${keyInput(key)}
          </div>
          <div>
            <div class="record-value-label">Value</div>
            ${renderSchema(additionalProperties, val, path, [...fieldPath, key])}
          </div>
          <div style="display:flex; align-items:end;">
            <button class="array-btn-remove" data-record-remove="${path}§${fieldPath.join('.')}§${key}">× Remove</button>
          </div>
        </div>
      `).join('')}
      <button class="array-btn-add" data-record-add="${path}§${fieldPath.join('.')}§${additionalProperties && additionalProperties.type === 'object' ? 'object' : additionalProperties && additionalProperties.prefixItems ? 'tuple' : additionalProperties && additionalProperties.type === 'array' ? 'array' : 'scalar'}§${recordKeyRef ? recordKeyRef.target : ''}">+ Add row</button>
    </div>
  `;
}

function renderEnum(schema, value, path, fieldPath) {
  const { enum: enumValues } = schema;
  return `
    <select class="field-input" data-input="${path}:${fieldPath.join('.')}">
      ${enumValues.map(v => `<option value="${v}" ${value === v ? 'selected' : ''}>${v}</option>`).join('')}
    </select>
  `;
}

function renderBoolean(schema, value, path, fieldPath) {
  return `
    <input type="checkbox" class="field-input" ${value ? 'checked' : ''} data-input="${path}:${fieldPath.join('.')}" />
  `;
}

function renderNumber(schema, value, path, fieldPath) {
  const step = schema.type === 'integer' ? '1' : 'any';
  return `
    <input type="number" step="${step}" class="field-input" value="${value ?? ''}" data-input="${path}:${fieldPath.join('.')}" />
  `;
}

function renderString(schema, value, path, fieldPath) {
  const fieldName = fieldPath[fieldPath.length - 1] || '';
  const isColor = /colou?r|tint/i.test(fieldName) || (typeof value === 'string' && /^#[0-9a-f]{3,8}$/i.test(value));

  if (isColor) {
    return `
      <div class="color-field">
        <input type="text" class="field-input" value="${value ?? ''}" data-input="${path}:${fieldPath.join('.')}" data-color-text="${path}:${fieldPath.join('.')}" />
        <input type="color" value="${value || '#000000'}" data-color-picker="${path}:${fieldPath.join('.')}" />
        <div class="color-swatch" style="background:${value || '#000000'};" data-color-swatch="${path}:${fieldPath.join('.')}"></div>
      </div>
    `;
  }

  return `
    <input type="text" class="field-input" value="${value ?? ''}" data-input="${path}:${fieldPath.join('.')}" />
  `;
}

function renderErrorList(errors) {
  return `
    <div class="error-list">
      <div class="error-list-title">Validation errors:</div>
      ${errors.map(e => `<div class="error-item">${e}</div>`).join('')}
    </div>
  `;
}

// ────────────────────────────────────────────────────────────────────────────
// Event listeners
// ────────────────────────────────────────────────────────────────────────────
function attachEventListeners() {
  // Nav items
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', () => {
      const [type, category] = el.dataset.nav.split(':');
      if (type === 'singleton') {
        state.currentView = { type: 'singleton', category };
      } else {
        state.currentView = { type: 'entity', category, selected: null };
      }
      state.entitySearch = '';
      state.saveErrors = {};
      render();
    });
  });

  // Entity selection
  document.querySelectorAll('[data-select]').forEach(el => {
    el.addEventListener('click', () => {
      const [category, id] = el.dataset.select.split(':');
      const entity = state.manifest.registries.logical.entities.find(e => e.name === category);
      const entryId = entity.kind === 'id' ? parseInt(id, 10) : id;
      state.currentView.selected = entryId;
      state.saveErrors = {};
      render();
    });
  });

  // Global search
  const globalSearch = document.getElementById('globalSearch');
  if (globalSearch) {
    globalSearch.addEventListener('input', (e) => {
      state.globalSearch = e.target.value;
      render();
    });
  }

  // Entity search
  const entitySearch = document.getElementById('entitySearch');
  if (entitySearch) {
    entitySearch.addEventListener('input', (e) => {
      state.entitySearch = e.target.value;
      render();
    });
  }

  // Collapsible groups
  document.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', () => {
      const path = el.dataset.toggle;
      state.collapsedGroups[path] = !state.collapsedGroups[path];
      render();
    });
  });

  // Array add/remove — commit current DOM edits into state, mutate the array's length, re-render.
  // (Structure lives in state.values; field VALUES are overlaid from the DOM on Save.)
  document.querySelectorAll('[data-array-add]').forEach(el => {
    el.addEventListener('click', () => {
      const [saveKey, fp, kind] = el.dataset.arrayAdd.split('§');
      commitDom(saveKey);
      const arr = ensureAt(loadedValueForSaveKey(saveKey), fp ? fp.split('.') : [], true);
      arr.push(defaultForKind(kind));
      render();
    });
  });
  document.querySelectorAll('[data-array-remove]').forEach(el => {
    el.addEventListener('click', () => {
      const [saveKey, fp, index] = el.dataset.arrayRemove.split('§');
      commitDom(saveKey);
      const arr = nodeAtPath(loadedValueForSaveKey(saveKey), fp ? fp.split('.') : []);
      if (Array.isArray(arr)) arr.splice(Number(index), 1);
      render();
    });
  });

  // Record add/remove/rename — same commit→mutate→render pattern.
  document.querySelectorAll('[data-record-add]').forEach(el => {
    el.addEventListener('click', () => {
      const [saveKey, fp, valueKind, keyRefTarget] = el.dataset.recordAdd.split('§');
      commitDom(saveKey);
      const rec = ensureAt(loadedValueForSaveKey(saveKey), fp ? fp.split('.') : [], false);
      let key;
      if (keyRefTarget) { // ref-keyed record → add the first option not already present
        const opts = (state.manifest.options[keyRefTarget] || []).map(o => o.key).filter(Boolean);
        key = opts.find(k => !(k in rec)) || opts[0] || 'key';
      } else { let i = 1; key = 'newKey'; while (key in rec) key = `newKey${++i}`; }
      if (!(key in rec)) rec[key] = defaultForKind(valueKind);
      render();
    });
  });
  document.querySelectorAll('[data-record-remove]').forEach(el => {
    el.addEventListener('click', () => {
      const [saveKey, fp, key] = el.dataset.recordRemove.split('§');
      commitDom(saveKey);
      const rec = nodeAtPath(loadedValueForSaveKey(saveKey), fp ? fp.split('.') : []);
      if (rec && typeof rec === 'object') delete rec[key];
      render();
    });
  });
  document.querySelectorAll('[data-record-rename]').forEach(el => {
    el.addEventListener('change', () => {
      const [saveKey, fp, oldKey] = el.dataset.recordRename.split('§');
      const newKey = el.value;
      if (!newKey || newKey === oldKey) return;
      commitDom(saveKey);
      const rec = nodeAtPath(loadedValueForSaveKey(saveKey), fp ? fp.split('.') : []);
      if (rec && typeof rec === 'object' && oldKey in rec && !(newKey in rec)) {
        rec[newKey] = rec[oldKey];
        delete rec[oldKey];
      }
      render();
    });
  });

  // Color pickers sync
  document.querySelectorAll('[data-color-picker]').forEach(el => {
    el.addEventListener('input', (e) => {
      const path = el.dataset.colorPicker;
      const textInput = document.querySelector(`[data-color-text="${path}"]`);
      const swatch = document.querySelector(`[data-color-swatch="${path}"]`);
      if (textInput) textInput.value = e.target.value;
      if (swatch) swatch.style.background = e.target.value;
    });
  });

  document.querySelectorAll('[data-color-text]').forEach(el => {
    el.addEventListener('input', (e) => {
      const path = el.dataset.colorText;
      const picker = document.querySelector(`[data-color-picker="${path}"]`);
      const swatch = document.querySelector(`[data-color-swatch="${path}"]`);
      if (picker && /^#[0-9a-f]{3,8}$/i.test(e.target.value)) picker.value = e.target.value;
      if (swatch) swatch.style.background = e.target.value;
    });
  });

  // Save buttons
  document.querySelectorAll('[data-save]').forEach(el => {
    el.addEventListener('click', async () => {
      const saveKey = el.dataset.save;
      await handleSave(saveKey);
    });
  });
}

// ────────────────────────────────────────────────────────────────────────────
// Save handler
// ────────────────────────────────────────────────────────────────────────────
async function handleSave(saveKey) {
  const parts = saveKey.split(':');
  const registry = parts[0]; // 'logical', 'ui', 'visual'
  let kind = null, category = null, id = null;

  if (registry === 'logical') {
    kind = parts[1]; // 'singleton' or 'entity'
    category = parts[2];
    id = kind === 'entity' ? (parts[3].match(/^\d+$/) ? parseInt(parts[3], 10) : parts[3]) : null;
  } else {
    // ui or visual
    category = parts[1];
    id = parts[2].match(/^\d+$/) ? parseInt(parts[2], 10) : parts[2];
    kind = null; // not used for ui/visual
  }

  // Reconstruct the value from the form
  const value = reconstructValue(saveKey);

  const result = await saveConfig(registry, kind, category, id, value);

  if (result.ok) {
    showToast('Saved successfully!', 'success');
    delete state.saveErrors[saveKey];
    // Refresh values
    state.values = await fetchValues();
    render();
  } else {
    state.saveErrors[saveKey] = result.errors || ['Unknown error'];
    showToast('Save failed — see errors below', 'error');
    render();
  }
}

// The originally-loaded value behind a Save panel (so reconstruct starts from it).
function loadedValueForSaveKey(saveKey) {
  const p = saveKey.split(':');
  if (p[0] === 'logical' && p[1] === 'singleton') return state.values.logical.singletons[p[2]] || {};
  if (p[0] === 'logical' && p[1] === 'entity') {
    const arr = state.values.logical.entities[p[2]] || [];
    return arr.find(e => String(e.id) === p[3] || e.key === p[3]) || {};
  }
  if (p[0] === 'ui') return (state.values.ui[p[1]] || {})[p[2]] || {};
  if (p[0] === 'visual') return (state.values.visual[p[1]] || {})[p[2]] || {};
  return {};
}

function reconstructValue(saveKey) {
  // Start from a clone of the loaded value — so fields NOT in the DOM (search-filtered out) survive,
  // and absent optional fields are not fabricated as null/'' (which fails z.number().optional() etc.).
  // Overlay only the present, non-empty inputs on top.
  const value = JSON.parse(JSON.stringify(loadedValueForSaveKey(saveKey)));
  document.querySelectorAll(`[data-input^="${saveKey}:"]`).forEach(input => {
    const v = getInputValue(input);
    if (v === null || v === '') return; // don't overwrite with / fabricate empties
    setValue(value, input.dataset.input.slice(saveKey.length + 1).split('.'), v);
  });
  return value;
}

// Write a panel's value back into state.values (inverse of loadedValueForSaveKey) — used to capture
// in-progress DOM edits before a structural (add/remove/rename) mutation so they aren't lost.
function setLoadedValueForSaveKey(saveKey, val) {
  const p = saveKey.split(':');
  if (p[0] === 'logical' && p[1] === 'singleton') state.values.logical.singletons[p[2]] = val;
  else if (p[0] === 'logical' && p[1] === 'entity') {
    const arr = state.values.logical.entities[p[2]] || [];
    const i = arr.findIndex(e => String(e.id) === p[3] || e.key === p[3]);
    if (i >= 0) arr[i] = val;
  } else if (p[0] === 'ui') { (state.values.ui[p[1]] = state.values.ui[p[1]] || {})[p[2]] = val; }
  else if (p[0] === 'visual') { (state.values.visual[p[1]] = state.values.visual[p[1]] || {})[p[2]] = val; }
}
function nodeAtPath(obj, parts) { let o = obj; for (const k of parts) { if (o == null) return undefined; o = o[Array.isArray(o) ? Number(k) : k]; } return o; }
function ensureAt(obj, parts, makeArray) {
  let o = obj;
  for (let i = 0; i < parts.length; i++) {
    const k = parts[i];
    if (i === parts.length - 1) { if (o[k] == null) o[k] = makeArray ? [] : {}; return o[k]; }
    if (o[k] == null) o[k] = {};
    o = o[k];
  }
  return o;
}
function defaultForKind(kind) {
  return kind === 'object' ? {} : kind === 'array' || kind === 'tuple' ? [] : kind === 'refNum' ? 0 : '';
}
// Capture the panel's current DOM edits into state so a structural mutation preserves them.
function commitDom(saveKey) { setLoadedValueForSaveKey(saveKey, reconstructValue(saveKey)); }

function setValue(obj, path, value) {
  const key = path[0];
  if (path.length === 1) {
    obj[key] = value;
  } else {
    if (!obj[key]) obj[key] = isNaN(path[1]) ? {} : [];
    setValue(obj[key], path.slice(1), value);
  }
}

function getInputValue(input) {
  if (input.type === 'checkbox') return input.checked;
  if (input.type === 'number') {
    const val = parseFloat(input.value);
    return isNaN(val) ? null : val;
  }
  return input.value;
}

// ────────────────────────────────────────────────────────────────────────────
// Toast
// ────────────────────────────────────────────────────────────────────────────
function showToast(message, type = 'success') {
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// ────────────────────────────────────────────────────────────────────────────
// Init
// ────────────────────────────────────────────────────────────────────────────
(async function init() {
  try {
    state.manifest = await fetchManifest();
    state.values = await fetchValues();
  } catch (err) {
    console.error('Init error:', err);
    state.error = err.message;
  }
  render();
})();
</script>
</body>
</html>
