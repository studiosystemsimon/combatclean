<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Combat Clean — Hero Menu mockup (AFK-Arena style)</title>
<style>
  :root{
    --bg:#0e1016; --panel:#161b27; --panel2:#1b2233; --line:#2a3346;
    --ink:#eef2fb; --dim:#9aa7bd; --faint:#6b7891;
    --gold:#ffd45e; --gold2:#ffb020;
    /* hero rarity ramp (from src/data/config/ui/rarities) */
    --common:#9aa7bd; --rare:#4aa3ff; --epic:#b46bff; --legendary:#ffb020; --mythic:#ff2e6e; --primal:#78f0ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#0a0b0f;color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;min-height:100vh;gap:12px;padding:18px 0 60px}
  .banner{color:var(--faint);font-size:12px;letter-spacing:.4px}
  .banner b{color:var(--gold)}
  /* phone frame */
  .device{width:430px;max-width:96vw;height:900px;max-height:86vh;background:var(--bg);border:1px solid #222b3d;
    border-radius:26px;overflow:hidden;position:relative;box-shadow:0 24px 70px rgba(0,0,0,.6)}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column}

  /* ── currency bar (shared chrome) ─────────────────────────────── */
  .topbar{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;flex:0 0 auto}
  .topbar .pool{background:#0c0f16;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:800;font-size:12px;color:#dce6f7}
  .topbar .sp{flex:1}
  .title{font-weight:900;letter-spacing:.5px;font-size:15px}

  /* ── ROSTER (hero list) ───────────────────────────────────────── */
  .roster{flex:1;overflow:auto;padding:4px 10px 20px}
  .seclabel{color:var(--gold);font-weight:800;font-size:11px;letter-spacing:.8px;text-transform:uppercase;margin:10px 4px 8px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .tile{position:relative;aspect-ratio:1/1;border-radius:13px;overflow:hidden;cursor:pointer;
    background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--rar) 26%,#121626),#0d1119 70%);
    border:2px solid var(--rar);box-shadow:0 3px 10px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.35)}
  .tile .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:center}
  .tile .pow{position:absolute;left:5px;top:4px;font-size:11px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000}
  .tile .pow i{color:var(--gold);font-style:normal}
  .tile .lv{position:absolute;right:5px;bottom:24px;font-size:11px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000}
  .tile .lv s{font-size:8px;text-decoration:none;opacity:.8;margin-right:1px}
  .tile .nm{position:absolute;left:0;right:0;bottom:0;padding:10px 4px 3px;font-size:11px;font-weight:800;text-align:center;
    color:#fff;text-shadow:0 1px 2px #000;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent)}
  .tile .stars{position:absolute;right:4px;top:4px;display:flex;gap:1px}
  .tile .stars i{width:6px;height:6px;font-size:8px;line-height:6px;color:var(--gold);opacity:.28}
  .tile .stars i.on{opacity:1;filter:drop-shadow(0 0 3px var(--gold))}

  /* ── HERO MENU (the isolated AFK-style view) ──────────────────── */
  .hero-menu{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
    background:
      radial-gradient(90% 55% at 50% 20%,color-mix(in srgb,var(--rar) 30%,transparent),transparent 70%),
      linear-gradient(180deg,#12friday 0,#0c0e14 60%);
    background-color:#0c0e14;
    transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.85,.25,1);pointer-events:none}
  .hero-menu.open{transform:none;pointer-events:auto}

  .hm-top{display:flex;align-items:center;gap:8px;padding:12px 10px 4px;position:relative;z-index:3}
  .hm-back{background:#0c0f16cc;border:1px solid var(--line);color:var(--ink);border-radius:10px;
    width:34px;height:34px;font-size:16px;cursor:pointer;display:grid;place-items:center}
  .hm-name{font-weight:900;font-size:17px;letter-spacing:.3px}
  .hm-rar{font-weight:900;font-size:10px;letter-spacing:.8px;padding:2px 8px;border-radius:999px;
    color:var(--rar);border:1px solid color-mix(in srgb,var(--rar) 60%,transparent);background:color-mix(in srgb,var(--rar) 14%,transparent)}
  .hm-cyc{display:flex;gap:6px;margin-left:auto}
  .hm-cyc button{background:#0c0f16cc;border:1px solid var(--line);color:var(--dim);border-radius:10px;width:34px;height:34px;font-size:15px;cursor:pointer}

  /* stage: big hero render + flanking gear + ascension */
  .hm-stage{position:relative;flex:0 0 auto;height:330px;display:flex;align-items:flex-end;justify-content:center}
  .hm-aura{position:absolute;left:50%;top:44%;width:300px;height:300px;transform:translate(-50%,-50%);
    background:radial-gradient(closest-side,color-mix(in srgb,var(--rar) 45%,transparent),transparent 72%);filter:blur(4px);opacity:.7}
  .hm-render{position:relative;z-index:2;height:300px;filter:drop-shadow(0 18px 22px rgba(0,0,0,.6))}
  .hm-render img{height:100%;width:auto;object-fit:contain}
  .hm-pedestal{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:230px;height:34px;z-index:1;
    background:radial-gradient(closest-side,color-mix(in srgb,var(--rar) 55%,transparent),transparent 75%);opacity:.55;filter:blur(2px)}
  /* level badge + ascension stars */
  .hm-lv{position:absolute;left:14px;top:6px;z-index:3;background:#0c0f16dd;border:1px solid var(--rar);
    border-radius:12px;padding:6px 10px;text-align:center;min-width:52px}
  .hm-lv b{display:block;font-size:22px;font-weight:900;line-height:1;color:#fff}
  .hm-lv s{font-size:9px;letter-spacing:1px;color:var(--dim);text-decoration:none}
  .hm-stars{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);z-index:3;display:flex;gap:4px}
  .hm-stars i{font-size:15px;color:var(--gold);opacity:.25}
  .hm-stars i.on{opacity:1;filter:drop-shadow(0 0 4px var(--gold))}

  /* gear rail (right flank, AFK arranges gear around the hero) */
  .hm-gear{position:absolute;right:10px;top:8px;z-index:3;display:flex;flex-direction:column;gap:9px}
  .gslot{width:52px;height:52px;border-radius:12px;position:relative;cursor:pointer;
    background:linear-gradient(180deg,#141a28,#0e1320);border:2px solid var(--gr,#33405a);
    display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.5)}
  .gslot .gi{font-size:22px;filter:drop-shadow(0 1px 2px #000)}
  .gslot .glv{position:absolute;right:-4px;bottom:-6px;background:#0c0f16;border:1px solid var(--gr,#33405a);
    color:#fff;font-size:10px;font-weight:900;border-radius:8px;padding:0 5px;min-width:16px;text-align:center}
  .gslot.empty{border-style:dashed;border-color:#39435c}
  .gslot.empty .gi{color:#4a566f}
  .gslot.locked{opacity:.6}
  .gslot .lockcap{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:800;
    color:var(--mythic);background:rgba(8,10,16,.55);border-radius:10px;letter-spacing:.3px;text-align:center;line-height:1.1}

  /* ── lower panel: tabs + body ─────────────────────────────────── */
  .hm-panel{flex:1;min-height:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#12friday,rgba(20,25,38,.96));
    background-color:#141926;border-top:1px solid var(--line);border-radius:18px 18px 0 0;margin-top:-6px;position:relative;z-index:4}
  .hm-tabs{display:flex;gap:6px;padding:10px 12px 0}
  .hm-tab{flex:1;text-align:center;padding:9px 0;border-radius:10px 10px 0 0;font-weight:800;font-size:12px;letter-spacing:.4px;
    color:var(--dim);cursor:pointer;background:transparent;border:none}
  .hm-tab.on{color:#fff;background:#1d2536;box-shadow:inset 0 2px 0 var(--gold)}
  .hm-body{flex:1;min-height:0;overflow:auto;padding:12px}

  /* stats */
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .stat{background:#0f1420;border:1px solid var(--line);border-radius:11px;padding:9px 11px;display:flex;align-items:center;gap:9px}
  .stat .k{color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.4px}
  .stat .v{margin-left:auto;font-weight:900;font-size:16px}
  .stat.big{grid-column:1/3;border-color:color-mix(in srgb,var(--gold) 40%,var(--line))}
  .stat.big .v{color:var(--gold);font-size:20px}
  .chip{display:inline-flex;align-items:center;gap:5px;background:#0f1420;border:1px solid var(--line);border-radius:999px;
    padding:4px 10px;font-size:11px;font-weight:800;color:var(--dim)}

  /* gear detail row (overview) */
  .gearlist{display:flex;flex-direction:column;gap:8px}
  .gearrow{display:flex;align-items:center;gap:10px;background:#0f1420;border:1px solid var(--line);border-left:3px solid var(--gr,#33405a);border-radius:11px;padding:9px 11px}
  .gearrow .gic{font-size:22px}
  .gearrow .gnm{font-weight:800}
  .gearrow .grr{font-size:11px;font-weight:800;color:var(--gr,#9aa7bd)}
  .gearrow .gpw{margin-left:auto;font-weight:900;color:var(--gold)}

  /* skills view */
  .skill{display:flex;gap:11px;background:#0f1420;border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:9px;cursor:pointer}
  .skill .sic{width:46px;height:46px;flex:0 0 auto;border-radius:11px;display:grid;place-items:center;font-size:24px;
    background:radial-gradient(120% 100% at 50% 0,color-mix(in srgb,var(--rar) 35%,#12friday),#0d1119);border:1px solid var(--rar)}
  .skill .snm{font-weight:900}
  .skill .styp{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--dim)}
  .skill .sds{color:var(--dim);font-size:12px;margin-top:3px}
  .skill .slv{margin-left:auto;font-weight:900;font-size:12px;color:var(--gold);white-space:nowrap}

  /* action bar */
  .hm-actions{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px 14px;border-top:1px solid var(--line);background:#10151f}
  .btn{border:none;border-radius:12px;padding:12px 8px;font-weight:900;font-size:13px;letter-spacing:.3px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;color:#0c0e14}
  .btn small{font-weight:800;font-size:10px;opacity:.8}
  .btn.gold{background:linear-gradient(180deg,#ffdd7a,#f2b021)}
  .btn.green{background:linear-gradient(180deg,#7ce0a0,#33b06a);color:#06110a}
  .btn.blue{background:linear-gradient(180deg,#7cc0ff,#3a8de0);color:#04121f}
  .btn.ghost{background:#1a2232;color:var(--dim);border:1px solid var(--line)}
  .btn:disabled{filter:grayscale(.7) brightness(.7);cursor:default}
  .btn.wide{grid-column:1/3}

  /* tiny toast for slot taps */
  .toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:30;background:#0c0f16ee;border:1px solid var(--line);
    border-radius:12px;padding:10px 14px;font-size:12px;color:var(--ink);opacity:0;transition:opacity .18s;pointer-events:none;max-width:80%;text-align:center}
  .toast.show{opacity:1}
  .note{color:var(--faint);font-size:11px;text-align:center;margin-top:8px}
</style>
</head>
<body>
  <div class="banner">Combat Clean · <b>Hero Menu</b> mockup — tap a hero → isolated AFK-style view. Iterate freely.</div>

  <div class="device">
    <!-- ROSTER -->
    <div class="screen" id="roster-screen">
      <div class="topbar">
        <div class="title">HEROES</div>
        <div class="sp"></div>
        <div class="pool">📘 4.2k</div>
        <div class="pool">🔧 1.8k</div>
      </div>
      <div class="roster">
        <div class="seclabel">★ Current Squad</div>
        <div class="grid" id="squad-grid"></div>
        <div class="seclabel">Roster</div>
        <div class="grid" id="roster-grid"></div>
        <div class="note">Numbers are illustrative — real stats come from the model. Tap any hero.</div>
      </div>
    </div>

    <!-- HERO MENU (isolated) -->
    <div class="hero-menu" id="hero-menu">
      <div class="hm-top">
        <button class="hm-back" id="hm-back">‹</button>
        <div class="hm-name" id="hm-name">Knight</div>
        <div class="hm-rar" id="hm-rar">RARE</div>
        <div class="hm-cyc">
          <button id="hm-prev">‹</button>
          <button id="hm-next">›</button>
        </div>
      </div>

      <div class="hm-stage">
        <div class="hm-aura"></div>
        <div class="hm-lv"><s>LV</s><b id="hm-lv">12</b></div>
        <div class="hm-render" id="hm-render"><img id="hm-img" alt=""/></div>
        <div class="hm-pedestal"></div>
        <div class="hm-stars" id="hm-stars"></div>
        <div class="hm-gear" id="hm-gear"></div>
      </div>

      <div class="hm-panel">
        <div class="hm-tabs">
          <button class="hm-tab on" data-tab="overview">OVERVIEW</button>
          <button class="hm-tab" data-tab="skills">SKILLS</button>
        </div>
        <div class="hm-body" id="hm-body"></div>
        <div class="hm-actions" id="hm-actions"></div>
      </div>

      <div class="toast" id="toast"></div>
    </div>
  </div>

<script>
/* ── real Combat Clean data (from src/data/config) ────────────────── */
const RAR = { common:'#9aa7bd', rare:'#4aa3ff', epic:'#b46bff', legendary:'#ffb020', mythic:'#ff2e6e', primal:'#78f0ff' };
const GRAR = { common:'#9aa7bd', uncommon:'#5ad17a', rare:'#4aa3ff', epic:'#b46bff', legendary:'#ffb020' };
const MAX_LEVEL = 50, MAX_ASC = 5;             // _progression.json
const GEAR_ICON = { weapon:'⚔', armor:'🛡', trinket:'💍' };
const WEAPON_LABEL = { blade:'Blade', bow:'Bow', magic:'Magic' };

const HEROES = [
  {k:'knight', name:'Knight', rar:'rare', weapon:'blade', level:12, asc:1, atk:14, hp:270,
    p:{s:1.75,x:-.107,y:-.423},
    abil:{basic:'Attack', normal:'Shield Bash', limit:'Valor Strike'},
    normal:{type:'burst',mult:2.2,chargeMs:6000}, limit:{type:'burst',mult:5.5,orders:5},
    gear:{weapon:{r:'rare',lv:8}, armor:{r:'uncommon',lv:5}, trinket:null}, squad:true},
  {k:'paladin', name:'Paladin', rar:'legendary', weapon:'blade', level:20, asc:2, atk:22, hp:315,
    p:{s:1.45,x:-.016,y:-.225},
    abil:{basic:'Attack', normal:'Consecrate', limit:'Divine Aegis'},
    normal:{type:'burst',mult:2.2,chargeMs:6000}, limit:{type:'burst',mult:5.5,orders:5},
    gear:{weapon:{r:'epic',lv:12}, armor:{r:'rare',lv:9}, trinket:{r:'rare',lv:7}}, squad:true},
  {k:'ranger', name:'Ranger', rar:'rare', weapon:'bow', level:10, asc:0, atk:16, hp:165,
    p:{s:1.7,x:.022,y:-.407},
    abil:{basic:'Attack', normal:'Volley', limit:'Arrow Storm'},
    normal:{type:'burst',mult:2.4,chargeMs:5500}, limit:{type:'aoe',mult:3,orders:5},
    gear:{weapon:{r:'rare',lv:6}, armor:null, trinket:null}, squad:true},
  {k:'wizard', name:'Wizard', rar:'epic', weapon:'magic', level:15, asc:1, atk:20, hp:142.5,
    p:{s:1.7,x:0,y:-.307},
    abil:{basic:'Attack', normal:'Fireball', limit:'Meteor'},
    normal:{type:'aoe',mult:1.8,chargeMs:6500}, limit:{type:'aoe',mult:4,orders:5},
    gear:{weapon:{r:'epic',lv:10}, armor:{r:'rare',lv:6}, trinket:{r:'uncommon',lv:4}}, squad:true},
  {k:'cleric', name:'Cleric', rar:'rare', weapon:'magic', level:9, asc:0, atk:12, hp:187.5,
    p:{s:1.55,x:.007,y:-.328},
    abil:{basic:'Attack', normal:'Heal', limit:'Sanctuary'},
    normal:{type:'heal',frac:0.12,chargeMs:6000}, limit:{type:'heal',frac:0.35,orders:5},
    gear:{weapon:{r:'rare',lv:5}, armor:{r:'rare',lv:5}, trinket:null}, squad:true},
  {k:'barbarian', name:'Barbarian', rar:'common', weapon:'blade', level:6, asc:0, atk:12, hp:247.5,
    p:{s:1.55,x:-.034,y:-.285},
    abil:{basic:'Attack', normal:'Wild Swing', limit:'Earthbreaker'},
    normal:{type:'aoe',mult:1.5,chargeMs:6500}, limit:{type:'aoe',mult:3.5,orders:5},
    gear:{weapon:{r:'common',lv:3}, armor:null, trinket:null}, squad:false},
];
const ART = (k) => `../../assets/combatclean/heroes/${k}.png`;

/* ── illustrative derived numbers (real formula lives in model/heroes.js) ── */
const atkAt = h => Math.round(h.atk * (1 + 0.06*(h.level-1)) * (1 + 0.08*h.asc));
const hpAt  = h => Math.round(h.hp  * (1 + 0.06*(h.level-1)) * (1 + 0.08*h.asc));
const gearPow = g => g ? ({common:1,uncommon:2,rare:3,epic:4,legendary:5}[g.r]*12 + g.lv*4) : 0;
const gearTotal = h => Object.values(h.gear).reduce((s,g)=>s+gearPow(g),0);
const power = h => Math.round(atkAt(h)*2 + hpAt(h)/2 + gearTotal(h));
const cap = h => MAX_LEVEL; // display cap; ascension adds to it in the real model
const abilLevel = h => 1 + h.asc; // illustrative: ascension bumps ability level

const abilityDesc = (a) => {
  if (a.type==='heal')  return `Heals the party for ${Math.round(a.frac*100)}% of max HP.`;
  if (a.type==='aoe')   return `Deals ${a.mult}× ATK to ALL enemies.`;
  return `Deals ${a.mult}× ATK to the focus target.`;
};
const stars = (n) => Array.from({length:MAX_ASC},(_,i)=>`<i class="${i<n?'on':''}">★</i>`).join('');
const portraitCss = (p) => `transform:translate(${p.x*100}%,${p.y*100}%) scale(${p.s})`;

/* ── roster render ────────────────────────────────────────────────── */
const tile = (h,i) => `
  <div class="tile" style="--rar:${RAR[h.rar]}" data-i="${i}">
    <img class="art" src="${ART(h.k)}" style="${portraitCss(h.p)}" alt="${h.name}"/>
    <span class="pow"><i>⚔</i> ${power(h)}</span>
    <span class="stars">${Array.from({length:MAX_ASC},(_,k)=>`<i class="${k<h.asc?'on':''}">★</i>`).join('')}</span>
    <span class="lv"><s>LV</s>${h.level}</span>
    <span class="nm">${h.name}</span>
  </div>`;
document.getElementById('squad-grid').innerHTML  = HEROES.map((h,i)=>h.squad?tile(h,i):'').join('');
document.getElementById('roster-grid').innerHTML = HEROES.map((h,i)=>!h.squad?tile(h,i):'').join('');
document.querySelectorAll('.tile').forEach(t=> t.addEventListener('click',()=>openMenu(+t.dataset.i)));

/* ── hero menu ────────────────────────────────────────────────────── */
const menu = document.getElementById('hero-menu');
let cur = 0, tab = 'overview';

function setVar(el,h){ el.style.setProperty('--rar', RAR[h.rar]); }

function renderGearRail(h){
  const slots = ['weapon','armor','trinket'];
  let html = slots.map(s=>{
    const g = h.gear[s];
    if(!g) return `<div class="gslot empty" data-slot="${s}"><span class="gi">${GEAR_ICON[s]}</span></div>`;
    return `<div class="gslot" data-slot="${s}" style="--gr:${GRAR[g.r]}">
        <span class="gi">${GEAR_ICON[s]}</span><span class="glv">${g.lv}</span></div>`;
  }).join('');
  // AFK-style Signature slot, gated at Mythic (locked here — a design proposal, not yet a system)
  const siLocked = !['mythic','primal'].includes(h.rar);
  html += `<div class="gslot locked" data-slot="sig">${siLocked
      ? '<div class="lockcap">SIG<br>MYTHIC</div>' : '<span class="gi">✦</span>'}</div>`;
  return html;
}

function renderOverview(h){
  const g = h.gear;
  const gearRow = (s)=>{ const it=g[s]; return it
    ? `<div class="gearrow" style="--gr:${GRAR[it.r]}"><span class="gic">${GEAR_ICON[s]}</span>
         <div><div class="gnm">${s[0].toUpperCase()+s.slice(1)}</div><div class="grr">${it.r.toUpperCase()} · Lv ${it.lv}</div></div>
         <span class="gpw">⚔ ${gearPow(it)}</span></div>`
    : `<div class="gearrow"><span class="gic" style="opacity:.4">${GEAR_ICON[s]}</span>
         <div><div class="gnm" style="color:var(--dim)">${s[0].toUpperCase()+s.slice(1)}</div><div class="grr" style="color:var(--faint)">empty — tap to equip</div></div></div>`; };
  return `
    <div class="statgrid">
      <div class="stat big"><span class="k">⚔ POWER</span><span class="v">${power(h)}</span></div>
      <div class="stat"><span class="k">ATK</span><span class="v">${atkAt(h)}</span></div>
      <div class="stat"><span class="k">HP</span><span class="v">${hpAt(h)}</span></div>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:12px">
      <span class="chip">${GEAR_ICON.weapon} ${WEAPON_LABEL[h.weapon]}</span>
      <span class="chip">✦ Ascension ${h.asc}/${MAX_ASC}</span>
      <span class="chip">Lv ${h.level}/${cap(h)}</span>
    </div>
    <div class="seclabel" style="margin:2px 2px 8px">Equipment</div>
    <div class="gearlist">${['weapon','armor','trinket'].map(gearRow).join('')}</div>`;
}

function renderSkills(h){
  const card=(icon,typ,name,desc,lv)=>`
    <div class="skill">
      <div class="sic">${icon}</div>
      <div style="flex:1;min-width:0">
        <div class="styp">${typ}</div><div class="snm">${name}</div><div class="sds">${desc}</div>
      </div>
      <div class="slv">Lv ${lv}</div>
    </div>`;
  return card('👊','Basic', h.abil.basic, 'Standard attack on the focus target.', abilLevel(h))
       + card('✨','Skill', h.abil.normal, `${abilityDesc(h.normal)} Charges every ${(h.normal.chargeMs/1000).toFixed(1)}s.`, abilLevel(h))
       + card('💥','Ultimate', h.abil.limit, `${abilityDesc(h.limit)} Fires after ${h.limit.orders} orders.`, abilLevel(h));
}

function renderActions(h){
  const atMax = h.level>=cap(h);
  return `
    <button class="btn gold" ${atMax?'disabled':''} data-act="lvl">${atMax?'★ MAX LEVEL':'⬆ LEVEL UP'}<small>${atMax?'':'📘 '+(120+h.level*40)}</small></button>
    <button class="btn gold" ${atMax?'disabled':''} data-act="lvlmax">⏫ LEVEL MAX<small>${atMax?'':'use all XP'}</small></button>
    <button class="btn green" data-act="ascend">✦ ASCEND ${h.asc}/${MAX_ASC}<small>🔁 sacrifices 1 copy</small></button>
    <button class="btn blue" data-act="equipbest">✨ EQUIP BEST<small>auto-optimise gear</small></button>`;
}

function renderMenu(){
  const h = HEROES[cur];
  setVar(menu,h);
  document.getElementById('hm-name').textContent = h.name;
  const rEl = document.getElementById('hm-rar'); rEl.textContent = h.rar.toUpperCase();
  document.getElementById('hm-lv').textContent = h.level;
  const img = document.getElementById('hm-img'); img.src = ART(h.k); img.alt = h.name;
  document.getElementById('hm-stars').innerHTML = stars(h.asc);
  document.getElementById('hm-gear').innerHTML = renderGearRail(h);
  document.getElementById('hm-body').innerHTML = tab==='overview' ? renderOverview(h) : renderSkills(h);
  document.getElementById('hm-actions').innerHTML = renderActions(h);
  document.querySelectorAll('.hm-tab').forEach(t=>t.classList.toggle('on', t.dataset.tab===tab));
  wireDynamic();
}

let toastT;
function toast(msg){
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),1300);
}

function wireDynamic(){
  document.querySelectorAll('#hm-gear .gslot').forEach(s=>s.onclick=()=>{
    const slot=s.dataset.slot;
    if(slot==='sig') return toast('Signature item — proposed to unlock at MYTHIC tier (AFK-style).');
    const g=HEROES[cur].gear[slot];
    toast(g ? `${slot[0].toUpperCase()+slot.slice(1)} · ${g.r.toUpperCase()} Lv ${g.lv} — tap opens reequip/compare.` : `${slot} empty — tap opens item picker.`);
  });
  document.querySelectorAll('#hm-actions .btn').forEach(b=>b.onclick=()=>{
    const h=HEROES[cur], act=b.dataset.act;
    if(act==='lvl' && h.level<cap(h)){ h.level++; renderMenu(); flash(); }
    else if(act==='lvlmax'){ h.level=cap(h); renderMenu(); flash(); }
    else if(act==='ascend'){ if(h.asc<MAX_ASC){ h.asc++; renderMenu(); flash(); toast('Ascended! +ability level, +level cap (sacrifices a copy).'); } else toast('Already at max ascension.'); }
    else if(act==='equipbest'){ toast('Auto-equips the best available item in each slot.'); }
  });
}
function flash(){ const img=document.getElementById('hm-img'); img.animate([{filter:'brightness(2.2)'},{filter:'brightness(1)'}],{duration:420,easing:'ease-out'}); }

function openMenu(i){ cur=i; tab='overview'; renderMenu(); menu.classList.add('open'); }
function closeMenu(){ menu.classList.remove('open'); }

document.getElementById('hm-back').onclick = closeMenu;
document.getElementById('hm-prev').onclick = ()=>{ cur=(cur-1+HEROES.length)%HEROES.length; tab='overview'; renderMenu(); };
document.getElementById('hm-next').onclick = ()=>{ cur=(cur+1)%HEROES.length; tab='overview'; renderMenu(); };
document.querySelectorAll('.hm-tab').forEach(t=>t.addEventListener('click',()=>{ tab=t.dataset.tab; renderMenu(); }));
</script>
</body>
</html>
