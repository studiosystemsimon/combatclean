<!doctype html><html><head><meta charset=utf-8><title>S-tile mockup</title>
<style>
  body{margin:0;background:#0e1016;color:#cdd3da;font:14px/1.4 system-ui;display:flex;flex-direction:column;align-items:center;gap:22px;padding:26px}
  h2{margin:4px 0;color:#eaf0f6;font-weight:700} .sub{color:#7f868d;font-size:12px}
  .board{width:min(92vw,680px);aspect-ratio:7/5;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:6px;
    background:#141821;padding:10px;border-radius:14px;border:1px solid #232a35}
  .cell{border-radius:10px;background:linear-gradient(180deg,#1b212c,#141a23);border:1px solid #232a35;position:relative;display:grid;place-items:center;overflow:hidden}
  .cell img{width:98%;height:98%;object-fit:contain}
  .cell.special{background:linear-gradient(180deg,rgba(255,212,94,.30),rgba(170,90,255,.18));
    border-color:rgba(255,212,94,.75);box-shadow:inset 0 0 0 1px rgba(255,212,94,.5),0 0 14px rgba(255,180,60,.45);
    animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:inset 0 0 0 1px rgba(255,212,94,.5),0 0 10px rgba(255,180,60,.35)}
    50%{box-shadow:inset 0 0 0 1px rgba(200,120,255,.6),0 0 20px rgba(180,90,255,.55)}}
  .plc{opacity:.5;font-size:20px}
  .row{display:flex;gap:26px;align-items:flex-end}
  .chip{background:#141821;border:1px solid #232a35;border-radius:12px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
  .swatch{background:repeating-conic-gradient(#20242c 0% 25%,#171b22 0% 50%) 50%/16px 16px;border-radius:10px;display:grid;place-items:center}
</style></head><body>
  <h2>Animated S-tile — merge board mockup</h2>
  <div class="sub">7×5 board · the orb is a looping APNG in the SPECIAL cell (gold↔violet pulse). Photoshop die-cut.</div>
  <div class="board" id="board"></div>
  <div class="row">
    <div class="chip"><div class="swatch" style="width:128px;height:128px"><img src="__URI__" style="width:100%"></div><span class="sub">128px</span></div>
    <div class="chip"><div class="swatch" style="width:96px;height:96px"><img src="__URI__" style="width:100%"></div><span class="sub">96px</span></div>
    <div class="chip"><div class="swatch" style="width:64px;height:64px"><img src="__URI__" style="width:100%"></div><span class="sub">64px</span></div>
  </div>
<script>
  const URI="__URI__", b=document.getElementById('board'), S=17;
  const filled={3:'⚔',4:'🛡',10:'🏹',12:'⚗',18:'🔮',22:'⚔',24:'🛡',30:'🏹'};
  for(let i=0;i<35;i++){const c=document.createElement('div');c.className='cell'+(i===S?' special':'');
    if(i===S){const im=document.createElement('img');im.src=URI;c.appendChild(im);}
    else if(filled[i]){const p=document.createElement('span');p.className='plc';p.textContent=filled[i];c.appendChild(p);}
    b.appendChild(c);}
</script></body></html>
