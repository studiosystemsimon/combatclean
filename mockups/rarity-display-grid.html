<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rarity Display Grid — mockup</title>
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    color:#eaf0ff;
    background:radial-gradient(1200px 700px at 50% -10%, #202a4d 0%, #0d1122 60%, #090c18 100%);
    min-height:100vh; padding:28px 18px 60px; -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:560px; margin:0 auto; }
  h1{ font-size:18px; letter-spacing:.5px; margin:0 0 4px; text-align:center; }
  .tag{ display:block; text-align:center; font-size:10px; font-weight:700; letter-spacing:1px;
        color:#ffd45e; margin:0 0 24px; }

  .row{ display:flex; align-items:center; gap:12px; margin:0 0 16px;
        background:linear-gradient(180deg,#1b2340,#151a2e);
        border:1px solid rgba(255,255,255,.10); border-radius:14px; padding:12px 14px; }
  .row .who{ width:120px; font-size:12px; font-weight:800; letter-spacing:.3px; }
  .row .who span{ display:block; font-size:9px; font-weight:700; color:#8fa1c4; letter-spacing:.5px; margin-top:2px; }

  /* =========================================================
     RARITY DISPLAY GRID  — reusable component
     one value pair = 16px (x) × 32px (y): hero icon 16×16 + % 16×16
     ========================================================= */
  .rdg{ display:flex; align-items:flex-start; gap:7px; }
  .rdg-cell{ flex:0 0 16px; width:16px; height:37px; position:relative;
             display:flex; flex-direction:column; align-items:center; }
  .rdg-icon{ width:16px; height:16px; border-radius:4px; overflow:hidden; position:relative;
             border:1px solid var(--rdg-c);
             background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(0,0,0,.25)), var(--rdg-bg); }
  .rdg-icon svg{ width:100%; height:100%; display:block; }
  /* "%" straddles the hero icon's bottom outline — centred, on the pair's exact vertical midline (y=16) */
  .rdg-pcsign{ position:absolute; left:0; right:0; top:14px; transform:translateY(-50%);
               text-align:center; font-size:10px; font-weight:900; color:#fff; line-height:1;
               pointer-events:none; z-index:2;
               text-shadow:0 1px 0 #000, 0 -1px 0 #000, 1px 0 0 #000, -1px 0 0 #000,
                           1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000; }
  /* the number — strictly bound to the 16px pair-box width, never overflows */
  .rdg-num{ width:16px; height:16px; line-height:16px; margin-top:5px; font-weight:800; color:#fff; text-align:center;
            overflow:hidden; white-space:nowrap; letter-spacing:-.2px;
            text-shadow:0 1px 0 #000, 0 -1px 0 #000, 1px 0 0 #000, -1px 0 0 #000,
                        1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Rarity Display Grid</h1>
  <span class="tag">MOCKUP · 16 × 37 per pair</span>
  <div id="gachas"></div>
</div>

<script>
  const RARITY_ORDER = ['common','rare','epic','legendary','mythic','primal'];
  const RARITIES = {
    common:    { color:'#9aa7bd' },
    rare:      { color:'#4aa3ff' },
    epic:      { color:'#b46bff' },
    legendary: { color:'#ffb020' },
    mythic:    { color:'#ff2e6e' },
    primal:    { color:'#78f0ff', prismatic:true },
  };
  const BANNERS = [
    { name:'EXCLUSIVE', sub:'SUMMON', theme:'#ff9e2e',
      weights:{ common:44, rare:30, epic:16, legendary:7, mythic:2.5, primal:0.5 } },
    { name:'MYTHIC', sub:'SUMMON', theme:'#ff2e6e',
      weights:{ rare:62, epic:24, legendary:10, mythic:3.5, primal:0.5 } },
    { name:'MEGA', sub:'SUMMON', theme:'#5a8cff',
      weights:{ common:60, rare:28, epic:10, legendary:1.8, mythic:0.18, primal:0.04 } },
  ];

  function heroSVG(prism){
    const defs = prism
      ? `<defs><linearGradient id="pr" x1="0" y1="0" x2="1" y2="1">
           <stop offset="0" stop-color="#ff5ea8"/><stop offset=".33" stop-color="#b46bff"/>
           <stop offset=".66" stop-color="#5ad1ff"/><stop offset="1" stop-color="#8affc4"/>
         </linearGradient></defs>` : '';
    return `<svg viewBox="0 0 48 48" aria-hidden="true">${defs}
      <g fill="var(--hf)">
        <ellipse cx="24" cy="17.5" rx="8.2" ry="8.6"/>
        <path d="M9.5 43c0-8.3 6.2-12.4 14.5-12.4S38.5 34.7 38.5 43a1 1 0 0 1-1 1h-27a1 1 0 0 1-1-1z"/>
      </g>
    </svg>`;
  }
  function fmtPct(v){
    if (v >= 10) return String(Math.round(v));
    if (v >= 1)  return (Math.round(v*10)/10).toString();
    return (Math.round(v*100)/100).toString();
  }
  function hex(h,a){ const n=parseInt(h.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; }
  function lighten(h,amt){ const n=parseInt(h.slice(1),16); let r=n>>16,g=(n>>8)&255,b=n&255;
    r=Math.round(r+(255-r)*amt); g=Math.round(g+(255-g)*amt); b=Math.round(b+(255-b)*amt); return `rgb(${r},${g},${b})`; }

  // ===== reusable component =====
  function renderRarityGrid(weights){
    const cells = RARITY_ORDER
      .filter(k => (weights[k]||0) > 0)
      .map(k => {
        const r = RARITIES[k], prism = !!r.prismatic;
        const bg  = prism ? 'linear-gradient(180deg,#3a1240,#101a2e)' : `linear-gradient(180deg,${hex(r.color,.32)},${hex(r.color,.08)})`;
        const hf  = prism ? 'url(#pr)' : lighten(r.color,.35);
        const num = fmtPct(weights[k]);
        const fs = num.length <= 2 ? 9 : num.length === 3 ? 8 : 6; // px — fits inside the 16px box
        return `<div class="rdg-cell">
            <div class="rdg-icon" style="--rdg-c:${r.color};--rdg-bg:${bg};--hf:${hf}">${heroSVG(prism)}</div>
            <div class="rdg-num" style="font-size:${fs}px">${num}</div>
            <div class="rdg-pcsign">%</div>
          </div>`;
      }).join('');
    return `<div class="rdg">${cells}</div>`;
  }

  document.getElementById('gachas').innerHTML = BANNERS.map(b => `
    <div class="row">
      <div class="who">${b.name}<span>${b.sub}</span></div>
      ${renderRarityGrid(b.weights)}
    </div>`).join('');
</script>
</body>
</html>
